{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - EV Connect </title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <style>
    body {
      background: linear-gradient(135deg, #e0f7f1, #f0f4f8);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .register-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease-in-out;
    }

    .register-container:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(22, 163, 74, 0.2);
    }

    .text-gradient {
      background: linear-gradient(135deg, #16a34a, #065f46);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .user-type-btn {
      border-radius: 12px;
      font-weight: 600;
      padding: 10px;
      transition: all 0.3s;
    }

    .user-type-btn.active {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff !important;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
    }

    .user-type-btn:hover {
      background-color: #dcfce7;
    }

    input.form-control {
      border-radius: 10px;
      border: 1px solid #d1d5db;
      transition: 0.3s;
    }

    input.form-control:focus {
      border-color: #16a34a;
      box-shadow: 0 0 8px rgba(22, 163, 74, 0.2);
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.3s;
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #15803d, #166534);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
      transform: scale(1.02);
    }

    .form-control::placeholder {
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .fade-in {
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="container mt-5 mb-5 fade-in">
    <div class="register-container mx-auto p-4 bg-white" style="max-width: 500px;">
      <div class="text-center mb-4">
        <div class="rounded-circle p-3" style="display:inline-block; background:linear-gradient(135deg,#16a34a,#15803d); color:white;">
          <i class="fas fa-user-plus fa-2x"></i>
        </div>
        <h3 class="mt-3 text-gradient">Create Your Account</h3>
        <p class="text-muted">Join the future of EV Battery Sharing ⚡</p>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <!-- User Type Buttons -->
      <div class="d-flex justify-content-between mb-3">
        <div class="user-type-btn btn btn-outline-success flex-fill me-2 active" data-type="user">
          <i class="fas fa-car-battery"></i><br>EV User
        </div>
        <div class="user-type-btn btn btn-outline-success flex-fill me-2" data-type="owner">
          <i class="fas fa-gas-pump"></i><br>Owner
        </div>
          <div class="user-type-btn btn btn-outline-success flex-fill me-2" data-type="mechanic">
            <i class="fas fa-wrench"></i><br>Mechanic
          </div>
        <div class="user-type-btn btn btn-outline-success flex-fill" data-type="admin">
          <i class="fas fa-user-shield"></i><br>Admin
        </div>
      </div>

      <form method="POST" class="mt-3">
        {% csrf_token %}
        <input type="hidden" name="user_type" id="user_type" value="user">

        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
          </div>
        </div>

        <div class="mb-3">
          <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3">
          <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>

        <div class="mb-3">
          <input type="tel" name="phone" class="form-control" placeholder="Mobile Number" required>
        </div>

        <div class="mb-3">
          <input type="text" name="address" class="form-control" placeholder="Full Address">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" name="city" class="form-control" placeholder="City">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" name="zip" class="form-control" placeholder="ZIP Code">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
          </div>
          <div class="col-md-6 mb-3">
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 mt-2 py-2">
          <i class="fas fa-user-check me-2"></i>Create Account
        </button>
      </form>

      <p class="text-center mt-3">Already a member? 
        <a href="{% url 'Vehicle:login_page' %}" class="text-success fw-semibold">Login here</a>
      </p>
    </div>
  </div>

  <script>
    document.querySelectorAll('.user-type-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.user-type-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('user_type').value = this.dataset.type;
      });
    });
  </script>
</body>
</html>
