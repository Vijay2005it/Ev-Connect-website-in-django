{% extends "Vehicle/base.html" %}
{% block content %}
<style>
  .mechanic-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff; /* plain white */
  }

  .mechanic-card {
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 420px;
    padding: 40px 30px;
    text-align: center;
    animation: fadeIn 0.7s ease;
  }

  .mechanic-card h2 {
    font-weight: 700;
    color: #198754;
    margin-bottom: 10px;
  }

  .mechanic-card p {
    color: #6c757d;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .form-control {
    border-radius: 10px;
    border: 2px solid #c3e6cb;
    padding: 10px;
    transition: 0.3s;
  }

  .form-control:focus {
    border-color: #198754;
    box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
  }

  .btn-add {
    width: 100%;
    border-radius: 10px;
    background: linear-gradient(135deg, #198754, #157347);
    border: none;
    color: white;
    font-size: 16px;
    padding: 10px;
    margin-top: 10px;
    transition: 0.3s;
    font-weight: 600;
  }

  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(25, 135, 84, 0.4);
  }

  .back-link {
    margin-top: 20px;
    color: #6c757d;
    font-size: 0.9rem;
  }

  .back-link a {
    color: #198754;
    text-decoration: none;
    font-weight: 600;
  }

  .back-link a:hover {
    text-decoration: underline;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="mechanic-wrapper">
  <div class="mechanic-card">
    <h2><i class="fas fa-tools me-2"></i>Add Mechanic</h2>
    <p>Register your station’s mechanic details here</p>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <input type="text" class="form-control" name="name" placeholder="Mechanic Name" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="phone" placeholder="Phone Number" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="experience" placeholder="Experience (e.g. 5 years, Expert)" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="specialization" placeholder="Specialization (e.g. Battery, Tire, Software)" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="username" placeholder="User Name" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-add">
        <i class="fas fa-plus-circle me-2"></i>Add Mechanic
      </button>
    </form>

    <p class="back-link">
      <a href="{% url 'Vehicle:owner_dashboard' %}">
        <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
      </a>
    </p>
  </div>
</div>
{% endblock %}
