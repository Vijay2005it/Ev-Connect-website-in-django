{% extends "Vehicle/base.html" %}
{% block content %}
<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f3f8f4;
    min-height: 100vh;
  }

  .add-bunker-container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    max-width: 700px;
    margin: 120px auto;
    padding: 40px;
  }

  .add-bunker-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .add-bunker-header h2 {
    font-weight: 700;
    color: #0d9488;
  }

  .form-label {
    font-weight: 600;
    color: #065f46;
  }

  .form-control {
    border-radius: 10px;
    padding: 12px 15px;
    border: 2px solid #e2e8f0;
    transition: 0.3s;
  }

  .form-control:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 0.2rem rgba(22, 163, 74, 0.25);
  }

  .btn-submit {
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 0;
    font-weight: 600;
    width: 100%;
    transition: all 0.3s ease;
  }

  .btn-submit:hover {
    background: linear-gradient(135deg, #15803d, #16a34a);
    transform: translateY(-2px);
  }

  .back-btn {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    color: #16a34a;
    font-weight: 500;
    transition: 0.3s;
  }

  .back-btn:hover {
    color: #15803d;
  }
</style>

{% comment %} <form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
</form> {% endcomment %}


<div class="container">
  <div class="add-bunker-container">
    <div class="add-bunker-header">
      <h2><i class="fas fa-plus-circle me-2"></i>Add New EV Bunker</h2>
      <p class="text-muted">Provide the details of your new EV charging bunker</p>
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div class="mb-3">
        <label class="form-label">Bunker Name</label>
        <input type="text" name="bunker_name" class="form-control" placeholder="Enter bunker name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" placeholder="Enter location" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" name="slots" class="form-control" placeholder="Number of available slots" min="1" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Rate per Hour (₹)</label>
        <input type="number" name="rate" class="form-control" placeholder="Enter rate per hour" min="1" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Upload Image</label>
        <input type="file" name="image" class="form-control" accept="image/*" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Short description about your bunker..."></textarea>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-check-circle me-2"></i>Save Bunker
      </button>
    </form>

    <div class="text-center">
      <a href="{% url 'Vehicle:owner_dashboard' %}" class="back-btn">
        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
