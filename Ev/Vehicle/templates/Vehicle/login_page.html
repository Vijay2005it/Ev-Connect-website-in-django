{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
  body {
    background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
      url("{% static 'Vehicle/img/best vehicles in 2025__topfinds.jpeg' %}") no-repeat center center/cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
    width: 400px;
    padding: 40px 30px;
    text-align: center;
    backdrop-filter: blur(8px);
    animation: fadeIn 0.8s ease;
  }

  .login-card h2 {
    font-weight: 700;
    color: #28a745;
    margin-bottom: 10px;
  }

  .login-card p {
    color: #6c757d;
    font-size: 0.95rem;
    margin-bottom: 25px;
  }

  .user-type-selector {
    display: flex;
    justify-content: space-between;
    margin-bottom: 25px;
  }

  .user-type-btn {
    border: 2px solid #28a745;
    border-radius: 12px;
    padding: 10px 15px;
    flex: 1;
    margin: 0 5px;
    cursor: pointer;
    color: #28a745;
    transition: 0.3s;
  }

  .user-type-btn.active {
    background: #28a745;
    color: white;
    box-shadow: 0 0 10px rgba(40, 167, 69, 0.4);
  }

  .user-type-btn i {
    font-size: 1.4rem;
    display: block;
    margin-bottom: 5px;
  }

  .form-control {
    border-radius: 10px;
    border: 2px solid #dee2e6;
    padding: 10px;
    transition: 0.3s;
  }

  .form-control:focus {
    border-color: #28a745;
    box-shadow: 0 0 0 0.2rem rgba(40,167,69,0.25);
  }

  .btn-login {
    width: 100%;
    border-radius: 10px;
    background: linear-gradient(135deg, #28a745, #1e7e34);
    border: none;
    color: white;
    font-size: 16px;
    padding: 10px;
    margin-top: 10px;
    transition: 0.3s;
    font-weight: 600;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
  }

  .register-link {
    margin-top: 20px;
    color: #6c757d;
  }

  .register-link a {
    color: #28a745;
    text-decoration: none;
    font-weight: 600;
  }

  .register-link a:hover {
    text-decoration: underline;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="login-card">
  <h2><i class="fas fa-bolt"></i> Welcome Back</h2>
  <p>Login to continue your EV journey ⚡</p>

  <!-- User Type -->
  <div class="user-type-selector">
    <div class="user-type-btn active" data-type="user">
      <i class="fas fa-user"></i>
      <span>User</span>
    </div>
    <div class="user-type-btn" data-type="owner">
      <i class="fas fa-gas-pump"></i>
      <span>Owner</span>
    </div>
    <div class="user-type-btn" data-type="mechanic">
      <i class="fas fa-tools"></i>
      <span>Mechanic</span>
    </div>
    <div class="user-type-btn" data-type="admin">
      <i class="fas fa-user-shield"></i>
      <span>Admin</span>
    </div>
  </div>

  <form method="POST">
    {% csrf_token %}
    <input type="hidden" name="user_type" id="user_type" value="user">

    <div class="mb-3">
      <input type="text" class="form-control" name="username" placeholder="Username" required>
    </div>

    <div class="mb-3">
      <input type="password" class="form-control" name="password" placeholder="Password" required>
    </div>

    <button type="submit" class="btn-login">
      <i class="fas fa-sign-in-alt me-2"></i>Login
    </button>
  </form>

  <p class="register-link">
    Don’t have an account? <a href="{% url 'Vehicle:register_page' %}">Register here</a>
  </p>
</div>

<script>
  // User type selector logic
  document.querySelectorAll('.user-type-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.user-type-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('user_type').value = this.dataset.type;
    });
  });
</script>

</body>
</html>
